#VRML_SIM R2025a utf8
# Savannah and woodland terrain for OFF TOUR.
# Height field follows the forest_firefighters UnevenForest Perlin noise,
# written for Webots R2025 ENU (height along Z, no Y-up rotation).
# Sassafras forest (forest_firefighters style) on Perlin terrain.
# template language: javascript

EXTERNPROTO "C:/Users/Omen/Desktop/webots-master/projects/appearances/protos/Grass.proto"
EXTERNPROTO "SassafrasForest.proto"
EXTERNPROTO "BushFire.proto"

PROTO SavannahRange [
  field SFVec3f  translation  0 0 0
  field SFString name         "savannah range"
  field SFVec2f  size         80 80
  field SFFloat  relief       6
  field SFInt32  randomSeed   2
]
{
  %<
    import * as wbrandom from 'wbrandom.js';
    import * as wbrotation from 'wbrotation.js';

    wbrandom.seed(fields.randomSeed.value);

    function gaussian2d(x, y, amp, cx, cy, sx, sy) {
      return amp * Math.exp(-((Math.pow(x - cx, 2) / (2.0 * Math.pow(sx, 2))) + (Math.pow(y - cy, 2) / (2.0 * Math.pow(sy, 2)))));
    }

    let perm = [];
    for (let i = 1; i <= 256; ++i)
      perm.splice(wbrandom.integer(i) - 1, 0, i);
    for (let i = 0; i < 256; ++i)
      perm.push(perm[i]);

    let dirs = [];
    for (let a = 0; a < 256; ++a)
      dirs.push([Math.cos(a * 2.0 * Math.PI / 256), Math.sin(a * 2.0 * Math.PI / 256)]);

    function noise(x, y, per) {
      function surflet(grid_x, grid_y) {
        const dist_x = Math.abs(x - grid_x);
        const dist_y = Math.abs(y - grid_y);
        const poly_x = 1 - 6 * Math.pow(dist_x, 5) + 15 * Math.pow(dist_x, 4) - 10 * Math.pow(dist_x, 3);
        const poly_y = 1 - 6 * Math.pow(dist_y, 5) + 15 * Math.pow(dist_y, 4) - 10 * Math.pow(dist_y, 3);
        const hashed = perm[(perm[(Math.floor(grid_x) % per)] + Math.floor(grid_y) % per)];
        const grad = (x - grid_x) * dirs[hashed - 1][0] + (y - grid_y) * dirs[hashed - 1][1];
        return poly_x * poly_y * grad;
      }
      const int_x = Math.floor(x);
      const int_y = Math.floor(y);
      return surflet(int_x, int_y) + surflet(int_x + 1, int_y) + surflet(int_x, int_y + 1) + surflet(int_x + 1, int_y + 1);
    }

    function fBm(x, y, per, octs) {
      let val = 0;
      for (let o = 0; o < octs; ++o)
        val += Math.pow(0.5, o) * noise(x * Math.pow(2, o), y * Math.pow(2, o), per * Math.pow(2, o));
      return val;
    }

    function distToSeg(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const ab2 = abx * abx + aby * aby;
      let t = ab2 > 0 ? ((px - ax) * abx + (py - ay) * aby) / ab2 : 0;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (ax + abx * t), py - (ay + aby * t));
    }

    function smoothstep(t) {
      const c = Math.max(0, Math.min(1, t));
      return c * c * (3 - 2 * c);
    }

    const xDimension = 48;
    const yDimension = 48;
    const sizeX = fields.size.value.x;
    const sizeY = fields.size.value.y;
    const relief = fields.relief.value;
    const perlinSize = 128;
    // Flat loop, then a wide verge so the banks are not cliffs.
    const roadHalf = 0.055;
    const verge = 0.09;
    const shoulder = 0.2;
    const x0 = 0.35, x1 = 0.72, y0 = 0.28, y1 = 0.62;
    let heights = [];
    for (let j = 0; j < yDimension; ++j) {
      for (let i = 0; i < xDimension; ++i) {
        const x = i / (xDimension - 1);
        const y = j / (yDimension - 1);
        let height = 0.5 * (1.0 + fBm(x, y, perlinSize, 3));
        height = height * (1.0 - gaussian2d(x - 0.5, y - 0.5, 1, 0, 0, 0.18, 0.18));
        const dRoad = Math.min(
          distToSeg(x, y, x0, y0, x1, y0),
          distToSeg(x, y, x0, y1, x1, y1),
          distToSeg(x, y, x0, y0, x0, y1),
          distToSeg(x, y, x1, y0, x1, y1)
        );
        const center = Math.hypot(x - 0.5, y - 0.5);
        let keep = 1;
        if (dRoad <= roadHalf + verge || center < 0.1)
          keep = 0;
        else {
          const roadT = (dRoad - roadHalf - verge) / shoulder;
          const centerT = (center - 0.1) / 0.1;
          keep = Math.min(smoothstep(roadT), smoothstep(centerT));
        }
        heights.push(height * keep * relief);
      }
    }

    function heightAt(x, y) {
      const xIndex = (x / sizeX) * (xDimension - 1);
      const yIndex = (y / sizeY) * (yDimension - 1);
      const x1 = Math.max(0, Math.min(xDimension - 2, Math.floor(xIndex)));
      const y1 = Math.max(0, Math.min(yDimension - 2, Math.floor(yIndex)));
      const dx = xIndex - x1;
      const dy = yIndex - y1;
      const h00 = heights[x1 + y1 * xDimension];
      const h10 = heights[(x1 + 1) + y1 * xDimension];
      const h01 = heights[x1 + (y1 + 1) * xDimension];
      const h11 = heights[(x1 + 1) + (y1 + 1) * xDimension];
      const h0 = h00 * (1 - dx) + h10 * dx;
      const h1 = h01 * (1 - dx) + h11 * dx;
      return h0 * (1 - dy) + h1 * dy;
    }

    const margin = 6;
    const density = 0.009;
    const minTreeSize = 5;
    const maxTreeSize = 10;
    const numberOfTree = Math.round(sizeX * sizeY * density);
    let trees = [];
    for (let i = 0; i < numberOfTree; ++i) {
      const x = wbrandom.real(margin, sizeX - margin);
      const y = wbrandom.real(margin, sizeY - margin);
      const dx = x - sizeX * 0.5;
      const dy = y - sizeY * 0.5;
      if (dx * dx + dy * dy < 18 * 18)
        continue;
      const nx = x / sizeX;
      const ny = y / sizeY;
      const roadHalf = 0.15;
      const x0 = 0.35, x1 = 0.72, y0 = 0.28, y1 = 0.62;
      const onHoriz = (Math.abs(ny - y0) <= roadHalf || Math.abs(ny - y1) <= roadHalf) && nx >= x0 - roadHalf && nx <= x1 + roadHalf;
      const onVert = (Math.abs(nx - x0) <= roadHalf || Math.abs(nx - x1) <= roadHalf) && ny >= y0 - roadHalf && ny <= y1 + roadHalf;
      if (onHoriz || onVert)
        continue;
      const z = heightAt(x, y);
      const angle = wbrandom.real(0, 2 * Math.PI);
      const treeSize = wbrandom.real(minTreeSize, maxTreeSize);
      trees.push({x: x, y: y, z: z, angle: angle, size: treeSize});
    }

    const fireSavannah = {x: 14, y: 52};
    fireSavannah.z = heightAt(fireSavannah.x, fireSavannah.y);
    const fireWood = {x: 62, y: 22};
    fireWood.z = heightAt(fireWood.x, fireWood.y);

  >%
  Solid {
    translation IS translation
    name IS name
    children [
      Shape {
        appearance Grass {
          colorOverride 0.76 0.58 0.22
          type "prickly"
          textureTransform TextureTransform {
            scale 20 20
          }
        }
        geometry DEF RANGE_GRID ElevationGrid {
          xDimension %<= xDimension >%
          xSpacing %<= sizeX / (xDimension - 1) >%
          yDimension %<= yDimension >%
          ySpacing %<= sizeY / (yDimension - 1) >%
          height [
            %< for (let h = 0; h < heights.length; ++h) { >%
              %<= heights[h] >%
            %< } >%
          ]
        }
      }
      %< for (let i = 0; i < trees.length; ++i) { >%
      SassafrasForest {
        translation %<= trees[i].x >% %<= trees[i].y >% %<= trees[i].z >%
        %<
          const rA = {x: 0, y: 0, z: 1, a: trees[i].angle};
          const rB = {x: 1, y: 0, z: 0, a: Math.PI / 2};
          const rotation = wbrotation.combine(rA, rB);
        >%
        rotation %<= rotation.x >% %<= rotation.y >% %<= rotation.z >% %<= rotation.a >%
        size %<= trees[i].size >%
        name %<= '"sassafras_' + i + '"' >%
      }
      %< } >%
      BushFire {
        translation %<= fireSavannah.x >% %<= fireSavannah.y >% %<= fireSavannah.z >%
        name "bushfire_savannah"
        intensity 10
      }
      BushFire {
        translation %<= fireWood.x >% %<= fireWood.y >% %<= fireWood.z >%
        name "bushfire_woodland"
        intensity 8
      }
    ]
    boundingObject USE RANGE_GRID
  }
}
